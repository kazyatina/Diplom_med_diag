<!DOCTYPE html>
<html lang="en">
<head>
    <title>Appointment</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="CareMed demo project">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="/static/styles/bootstrap4/bootstrap.min.css">
    <link href="/static/plugins/font-awesome-4.7.0/css/font-awesome.min.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" type="text/css" href="/static/plugins/OwlCarousel2-2.2.1/owl.carousel.css">
    <link rel="stylesheet" type="text/css" href="/static/plugins/OwlCarousel2-2.2.1/owl.theme.default.css">
    <link rel="stylesheet" type="text/css" href="/static/plugins/OwlCarousel2-2.2.1/animate.css">
    <link rel="stylesheet" type="text/css" href="/static/styles/services.css">
    <link rel="stylesheet" type="text/css" href="/static/styles/services_responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>

<div class="super_container">

    {%include 'header.html'%}

    <!-- Home -->

    <div class="home">
        <div class="home_background parallax-window" data-parallax="scroll" data-image-src="/static/images/services.jpg"
             data-speed="0.8"></div>
        <div class="home_container">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <div class="home_content">
                            <div class="home_title"><span>CareMed</span> Запись на прием</div>
                            <div class="breadcrumbs">
                                <ul>
                                    <li><a href="{% url 'core:home' %}">Главная</a></li>
                                    <li>Запись на прием</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Запись на приём</h4>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="{{ form.service.id_for_label }}" class="form-label">Услуга *</label>
                                    {{ form.service }}
                                </div>
                                <div class="col-md-6">
                                    <label for="{{ form.doctor.id_for_label }}" class="form-label">Врач</label>
                                    {{form.doctor}}
                                </div>
                                <div class="col-md-6">
                                    <label for="{{ form.date.id_for_label }}" class="form-label">Дата приёма *</label>
                                    {{ form.date }}
                                </div>
                                <div class="col-md-6">
                                    <label for="{{ form.time.id_for_label }}" class="form-label">Время приёма *</label>
                                    {{form.time}}
                                </div>
                                <div class="col-12">
                                    <label for="{{ form.notes.id_for_label }}" class="form-label">Примечания</label>
                                    {{form.notes}}
                                    <small class="text-muted">Укажите симптомы или другую важную информацию</small>
                                </div>
                            </div>
                            <div class="mt-4 d-grid gap-2">
                                <button type="submit" class="btn btn-success">Записаться</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% include 'footer.html' %}
<script src="/static/js/jquery-3.2.1.min.js"></script>
<script src="/static/styles/bootstrap4/popper.js"></script>
<script src="/static/styles/bootstrap4/bootstrap.min.js"></script>
<script src="/static/plugins/easing/easing.js"></script>
<script src="/static/plugins/parallax-js-master/parallax.min.js"></script>
<script src="/static/js/services.js"></script>
</body>
</html>
